# Server Config
server.port=5000

# Database Config (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/safetravel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Config
jwt.secret=safetravel_secret_key_long_enough_to_satisfy_hmac_requirements_256_bits_minimum_size_32_characters
jwt.expiration=86400000
